<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <header class="glass-header">
            <div class="brand">
                <i class="fa-solid fa-box-archive logo-icon"></i>
                <h1>Inventory System</h1>
            </div>
            <div class="stats-card glass-panel">
                <span class="stats-label">Total Units in Stock</span>
                <span class="stats-value" id="total-units">Loading...</span>
            </div>
        </header>

        <main>
            <div class="controls-bar">
                <h2>Current Inventory</h2>
                <button id="add-mask-btn" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Add New Product
                </button>
            </div>

            <div id="loader" class="loader-container">
                <div class="spinner"></div>
            </div>

            <div id="masks-grid" class="masks-grid" style="display: none;">
            </div>

            <div id="empty-state" class="empty-state" style="display: none;">
                <i class="fa-solid fa-box-open"></i>
                <p>No products found in the inventory.</p>
                <p class="subtitle">Click "Add New Product" to get started.</p>
            </div>

            <section class="computations-section glass-panel" style="margin-bottom: 2rem;">
                <h2>Computations & Tools</h2>
                <div class="tools-grid">
                    <div class="tool-card">
                        <h3><i class="fa-solid fa-cart-shopping"></i> Cart Total (5 Items)</h3>
                        <div class="cart-inputs" id="cart-inputs-container">

                        </div>
                        <button id="compute-cart-btn" class="btn btn-primary btn-block">Compute Total</button>
                        <div class="result-display" id="cart-result">-</div>
                    </div>

                    <div class="tool-card">
                        <h3><i class="fa-solid fa-file-invoice-dollar"></i> IVA Calculator</h3>
                        <div class="form-group">
                            <label>Select Product</label>
                            <select id="iva-product-select" class="form-select"></select>
                        </div>
                        <button id="compute-iva-btn" class="btn btn-primary btn-block">Compute IVA (16%)</button>
                        <div class="result-display" id="iva-result">-</div>
                    </div>

                    <div class="tool-card">
                        <h3><i class="fa-solid fa-calendar-days"></i> Expiration Tracker</h3>
                        <div class="form-group">
                            <label>Select Product</label>
                            <select id="exp-product-select" class="form-select"></select>
                        </div>
                        <div class="date-inputs form-row" style="gap: 10px; margin-bottom: 1rem;">
                            <input type="number" id="exp-day" placeholder="DD" min="1" max="31" class="form-input"
                                style="width: 30%;">
                            <input type="number" id="exp-month" placeholder="MM" min="1" max="12" class="form-input"
                                style="width: 30%;">
                            <input type="number" id="exp-year" placeholder="YYYY" class="form-input"
                                style="width: 40%;">
                        </div>
                        <button id="compute-exp-btn" class="btn btn-primary btn-block">Compute Days Left</button>
                        <div class="result-display" id="exp-result">-</div>
                    </div>
                </div>
            </section>
        </main>

        <div id="mask-modal" class="modal-overlay">
            <div class="modal glass-panel">
                <div class="modal-header">
                    <h2 id="modal-title">Add Product</h2>
                    <button id="close-modal" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="mask-form">
                    <input type="hidden" id="mask-id">

                    <div class="form-group">
                        <label for="serialNumber">Serial Number <span class="required">*</span></label>
                        <input type="number" id="serialNumber" required placeholder="e.g. 1001">
                    </div>

                    <div class="form-group">
                        <label for="brand">Brand <span class="required">*</span></label>
                        <input type="text" id="brand" required placeholder="e.g. 3M, Honeywell">
                    </div>

                    <div class="form-group">
                        <label for="model">Model</label>
                        <input type="text" id="model" placeholder="e.g. N95, KN95">
                    </div>

                    <div class="form-group">
                        <label for="color">Color</label>
                        <input type="text" id="color" placeholder="e.g. White, Black">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="price">Price ($) <span class="required">*</span></label>
                            <input type="number" id="price" required min="0" step="0.01" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label for="units">Units <span class="required">*</span></label>
                            <input type="number" id="units" required min="0" step="1" placeholder="0">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="save-btn">Save Mask</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>

</html>

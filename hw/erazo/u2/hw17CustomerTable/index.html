<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #f8fafc;
        background:
          radial-gradient(circle at top left, rgba(20, 184, 166, 0.24), transparent 36rem),
          radial-gradient(circle at bottom right, rgba(244, 63, 94, 0.18), transparent 34rem),
          linear-gradient(135deg, #070b14 0%, #111827 45%, #0f172a 100%);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 52px 0;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.4fr 0.6fr;
        gap: 18px;
        align-items: stretch;
        margin-bottom: 22px;
      }

      .panel {
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(18px);
      }

      .headline {
        padding: 32px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #2dd4bf;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.1rem, 5vw, 4.6rem);
        line-height: 1;
        font-weight: 900;
      }

      .subtitle {
        max-width: 660px;
        margin: 18px 0 0;
        color: #cbd5e1;
        font-size: 1.02rem;
        line-height: 1.7;
      }

      .metric {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        justify-content: space-between;
        padding: 28px;
        background:
          linear-gradient(145deg, rgba(20, 184, 166, 0.24), rgba(244, 63, 94, 0.16)),
          rgba(15, 23, 42, 0.9);
      }

      .metric span {
        color: #cbd5e1;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .metric strong {
        margin-top: 26px;
        font-size: clamp(2rem, 5vw, 3.8rem);
        line-height: 1;
        color: #ffffff;
      }

      .table-shell {
        overflow: hidden;
      }

      .table-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 22px 24px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      }

      .table-top h2 {
        margin: 0;
        font-size: 1.15rem;
      }

      .status-pill {
        min-width: 118px;
        padding: 8px 12px;
        border: 1px solid rgba(45, 212, 191, 0.36);
        border-radius: 999px;
        color: #99f6e4;
        background: rgba(20, 184, 166, 0.1);
        font-size: 0.82rem;
        font-weight: 700;
        text-align: center;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 18px 24px;
        text-align: left;
        white-space: nowrap;
      }

      th {
        color: #94a3b8;
        background: rgba(2, 6, 23, 0.56);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      tbody tr {
        border-top: 1px solid rgba(148, 163, 184, 0.1);
        transition: background 160ms ease, transform 160ms ease;
      }

      tbody tr:hover {
        background: rgba(45, 212, 191, 0.07);
      }

      td {
        color: #e2e8f0;
      }

      td:first-child {
        color: #ffffff;
        font-weight: 800;
      }

      .money {
        color: #5eead4;
        font-weight: 900;
      }

      .message {
        padding: 34px 24px;
        color: #cbd5e1;
        text-align: center;
      }

      .error {
        color: #fecdd3;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 20px, 1120px);
          padding: 22px 0;
        }

        .hero {
          grid-template-columns: 1fr;
        }

        .headline,
        .metric {
          padding: 22px;
        }

        .table-top {
          align-items: flex-start;
          flex-direction: column;
        }

        th,
        td {
          padding: 14px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="panel headline">
          <p class="eyebrow">MongoDB Customer Collection</p>
          <h1>Customer Dashboard</h1>
        </div>
        <aside class="panel metric">
          <span>Total Spent</span>
          <strong>$<span id="totalSpent">0.00</span></strong>
        </aside>
      </section>

      <section class="panel table-shell">
        <div class="table-top">
          <h2>Customer Documents</h2>
          <div class="status-pill" id="statusText">Loading</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr id="customerTableHead">
                <th>Loading</th>
              </tr>
            </thead>
            <tbody id="customerTableBody">
              <tr>
                <td colspan="3" class="message">Loading customers...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>

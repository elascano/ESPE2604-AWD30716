<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erazo Customer REST Services</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #f8fafc;
        background:
          radial-gradient(circle at top left, rgba(6, 182, 212, 0.22), transparent 34rem),
          radial-gradient(circle at bottom right, rgba(244, 63, 94, 0.18), transparent 32rem),
          linear-gradient(135deg, #050816 0%, #111827 52%, #0f172a 100%);
      }

      button,
      input,
      select {
        font: inherit;
      }

      main {
        width: min(1240px, calc(100% - 28px));
        margin: 0 auto;
        padding: 34px 0;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.35fr 0.65fr;
        gap: 18px;
        margin-bottom: 18px;
      }

      .panel {
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(18px);
      }

      .headline {
        padding: 30px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #67e8f9;
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4.6vw, 4.5rem);
        line-height: 1;
        font-weight: 900;
      }

      .subtitle {
        max-width: 700px;
        margin: 16px 0 0;
        color: #cbd5e1;
        font-size: 1rem;
        line-height: 1.65;
      }

      .metric {
        display: grid;
        gap: 16px;
        align-content: space-between;
        padding: 28px;
        background:
          linear-gradient(145deg, rgba(6, 182, 212, 0.24), rgba(244, 63, 94, 0.16)),
          rgba(15, 23, 42, 0.92);
      }

      .metric span {
        color: #cbd5e1;
        font-size: 0.84rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .metric strong {
        color: #ffffff;
        font-size: clamp(2rem, 4vw, 3.35rem);
        line-height: 1;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .form-panel {
        padding: 22px;
        position: sticky;
        top: 16px;
      }

      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .panel-title h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .mode-pill {
        min-width: 96px;
        padding: 7px 10px;
        border: 1px solid rgba(103, 232, 249, 0.4);
        border-radius: 999px;
        color: #a5f3fc;
        background: rgba(8, 145, 178, 0.12);
        font-size: 0.78rem;
        font-weight: 800;
        text-align: center;
      }

      .form-grid {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 7px;
        color: #cbd5e1;
        font-size: 0.82rem;
        font-weight: 800;
      }

      input,
      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 8px;
        outline: none;
        color: #f8fafc;
        background: rgba(2, 6, 23, 0.48);
        padding: 10px 12px;
      }

      input:focus,
      select:focus {
        border-color: rgba(103, 232, 249, 0.78);
        box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.16);
      }

      select option {
        color: #0f172a;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      .full-action {
        grid-column: 1 / -1;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        cursor: pointer;
        font-weight: 900;
        transition: transform 160ms ease, filter 160ms ease, opacity 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.58;
        transform: none;
      }

      .primary {
        background: linear-gradient(135deg, #0891b2, #14b8a6);
      }

      .secondary {
        background: rgba(71, 85, 105, 0.86);
      }

      .danger {
        background: linear-gradient(135deg, #e11d48, #f97316);
      }

      .ghost {
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: #cbd5e1;
        background: rgba(15, 23, 42, 0.7);
      }

      .status {
        min-height: 24px;
        margin: 14px 0 0;
        color: #a5f3fc;
        font-size: 0.88rem;
        line-height: 1.45;
      }

      .status.error {
        color: #fecdd3;
      }

      .table-shell {
        overflow: hidden;
      }

      .table-top {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: center;
        padding: 20px 22px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      }

      .table-top h2 {
        margin: 0;
        font-size: 1.08rem;
      }

      .table-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }

      .status-pill {
        min-width: 116px;
        padding: 9px 12px;
        border: 1px solid rgba(103, 232, 249, 0.36);
        border-radius: 999px;
        color: #a5f3fc;
        background: rgba(8, 145, 178, 0.1);
        font-size: 0.82rem;
        font-weight: 800;
        text-align: center;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 15px 18px;
        text-align: left;
        white-space: nowrap;
      }

      th {
        color: #94a3b8;
        background: rgba(2, 6, 23, 0.56);
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      tbody tr {
        border-top: 1px solid rgba(148, 163, 184, 0.1);
      }

      tbody tr:hover {
        background: rgba(6, 182, 212, 0.06);
      }

      td {
        color: #e2e8f0;
      }

      td:first-child {
        color: #ffffff;
        font-weight: 900;
      }

      .money {
        color: #5eead4;
        font-weight: 900;
      }

      .row-actions {
        display: flex;
        gap: 8px;
      }

      .row-actions button {
        min-height: 34px;
        padding: 0 12px;
        font-size: 0.78rem;
      }

      .message {
        padding: 34px 22px;
        color: #cbd5e1;
        text-align: center;
      }

      .error {
        color: #fecdd3;
      }

      @media (max-width: 940px) {
        .hero,
        .workspace {
          grid-template-columns: 1fr;
        }

        .form-panel {
          position: static;
        }
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 20px, 1240px);
          padding: 20px 0;
        }

        .headline,
        .metric,
        .form-panel {
          padding: 20px;
        }

        .table-top {
          align-items: flex-start;
          flex-direction: column;
        }

        .table-tools {
          justify-content: flex-start;
        }

        th,
        td {
          padding: 13px 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="panel headline">
          <p class="eyebrow">Google Cloud Ready REST API</p>
          <h1>Erazo Customer Services</h1>
          <p class="subtitle">Manage customer documents with GET, POST, PUT, and DELETE from one responsive MongoDB dashboard.</p>
        </div>
        <aside class="panel metric">
          <span>Total Spent</span>
          <strong>$<span id="totalSpent">0.00</span></strong>
        </aside>
      </section>

      <section class="workspace">
        <form class="panel form-panel" id="customerForm">
          <div class="panel-title">
            <h2 id="formTitle">New Customer</h2>
            <span class="mode-pill" id="modePill">POST</span>
          </div>
          <input type="hidden" id="customerId" />
          <div class="form-grid">
            <label>
              Name
              <input id="name" type="text" required maxlength="80" />
            </label>
            <label>
              Email
              <input id="email" type="email" maxlength="120" />
            </label>
            <label>
              Age
              <input id="age" type="number" min="0" max="120" />
            </label>
            <label>
              Type
              <select id="type">
                <option value="Normal">Normal</option>
                <option value="Frequent">Frequent</option>
                <option value="VIP">VIP</option>
                <option value="Premium">Premium</option>
              </select>
            </label>
            <label>
              Discount
              <input id="discount" type="number" min="0" max="100" step="0.01" />
            </label>
            <label>
              Money Spent
              <input id="moneySpent" type="number" min="0" step="0.01" />
            </label>
          </div>
          <div class="actions">
            <button class="primary full-action" type="submit" id="submitBtn">Create Customer</button>
            <button class="secondary" type="button" id="resetBtn">Clear</button>
            <button class="danger" type="button" id="deleteBtn" disabled>Delete</button>
          </div>
          <p class="status" id="formStatus"></p>
        </form>

        <section class="panel table-shell">
          <div class="table-top">
            <h2>Customer Documents</h2>
            <div class="table-tools">
              <button class="ghost" type="button" id="refreshBtn">Refresh</button>
              <div class="status-pill" id="statusText">Loading</div>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr id="customerTableHead">
                  <th>Loading</th>
                </tr>
              </thead>
              <tbody id="customerTableBody">
                <tr>
                  <td colspan="8" class="message">Loading customers...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>

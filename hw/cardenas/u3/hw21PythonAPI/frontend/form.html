<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Supply - Fabula Dental</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container">
    <header>
      <h1 id="formTitle">New Supply</h1>
      <a href="index.html" class="btn btn-secondary">Back</a>
    </header>

    <form id="supplyForm">
      <div class="form-group">
        <label for="supplyName">Supply Name</label>
        <input type="text" id="supplyName" required>
      </div>

      <div class="form-group">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" min="0" required>
      </div>

      <div class="form-group">
        <label for="unitCost">Unit Cost</label>
        <input type="number" id="unitCost" min="0.01" step="0.01" required>
      </div>

      <div class="form-group">
        <label for="orderDate">Order Date</label>
        <input type="date" id="orderDate" required>
      </div>

      <div class="form-group">
        <label for="expirationDate">Expiration Date</label>
        <input type="date" id="expirationDate" required>
      </div>

      <div class="form-actions">
        <a href="index.html" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn">Save Supply</button>
      </div>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/form.js"></script>
</body>
</html>

version: '3.8'

services:
  web:
    build: .
    container_name: php_monolith_app
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE}

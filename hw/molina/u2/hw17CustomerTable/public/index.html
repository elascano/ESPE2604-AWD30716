<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Store Customers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-container">
        <header class="main-header">
            <h1>Edison's Computer Store</h1>
            <p>Customer management view using REST API GET endpoints</p>
        </header>

        <section class="summary-section">
            <article class="summary-card">
                <h2>Total Customers</h2>
                <p id="totalCustomers">0</p>
            </article>

            <article class="summary-card">
                <h2>Total Money Spent</h2>
                <p id="totalMoneySpent">$0.00</p>
            </article>
        </section>

        <section class="filters-section">
            <div class="filter-card">
                <h3>General Queries</h3>

                <div class="form-row">
                    <select id="generalQuerySelect">
                        <option value="all">All Customers</option>
                        <option value="names">Only Names</option>
                        <option value="ages">Only Ages</option>
                        <option value="moneySpent">Only Money Spent</option>
                    </select>

                    <button id="btnRunGeneralQuery">Load</button>
                </div>
            </div>

            <div class="filter-card">
                <h3>Search Customers</h3>

                <div class="form-row">
                    <select id="searchTypeSelect">
                        <option value="id">Search by ID</option>
                        <option value="name">Search by Name</option>
                        <option value="age">Search by Age</option>
                        <option value="moneyRange">Search by Money Spent Range</option>
                    </select>
                </div>

                <div id="searchFieldsContainer" class="form-row search-fields">
                </div>

                <div class="form-row">
                    <button id="btnRunSearch">Search</button>
                </div>
            </div>
        </section>

        <section class="table-section">
            <div class="table-header">
                <h2 id="tableTitle">Customers</h2>
                <span id="statusMessage">Ready</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Money Spent</th>
                        </tr>
                    </thead>

                    <tbody id="customersTableBody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>

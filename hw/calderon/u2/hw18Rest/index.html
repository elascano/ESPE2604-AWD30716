<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Calderon Computer Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 1000px;">
        <h1>Clients - Calderon Computer Store</h1>
        
        <div id="error-container"></div>
        
        <div class="stats-container">
            <div class="row">
                <div class="col-md-3">
                    <div class="stat-card">
                        <h5>Total number of customers</h5>
                        <div class="value" id="totalCustomers">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <h5>Total amount spent</h5>
                        <div class="value" id="totalSpent">$0.00</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <h5>Average amount spent</h5>
                        <div class="value" id="avgSpent">$0.00</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <h5>Average age</h5>
                        <div class="value" id="avgAge">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Loading data...</p>
        </div>

        <div id="table-container" style="display: none;">
            <div class="row mb-3">
                <div class="col-md-8">
                    <button class="btn btn-success" onclick="openCreateModal()">
                        ➕ Add New Customer
                    </button>
                </div>
                <div class="col-md-4">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search by name...">
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID (Sistema)</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Amount Spent</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody">
                    </tbody>
                </table>
            </div>

            <nav aria-label="Navegación de páginas" class="mt-4">
                <ul class="pagination justify-content-center" id="paginationContainer">
                </ul>
            </nav>
        </div>
    </div> <div class="modal fade" id="customerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header text-white" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <h5 class="modal-title" id="modalTitle">Add Customer</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="customerForm">
                        <div class="mb-3">
                            <label for="customerId" class="form-label">Customer ID</label>
                            <input type="number" class="form-control" id="customerId" required>
                        </div>
                        <div class="mb-3">
                            <label for="customerName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="customerName" required>
                        </div>
                        <div class="mb-3">
                            <label for="customerAge" class="form-label">Age</label>
                            <input type="number" class="form-control" id="customerAge" required>
                        </div>
                        <div class="mb-3">
                            <label for="customerSpent" class="form-label">Amount Spent ($)</label>
                            <input type="number" step="0.01" class="form-control" id="customerSpent" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="saveCustomer()">Guardar Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Students | American Latin Class</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg alc-navbar sticky-top">
    <div class="container-fluid px-lg-5">
      <a class="navbar-brand alc-brand" href="index.html" aria-label="American Latin Class">
        <span class="alc-brand-mark">ALC</span>
        <span>
          <strong>American Latin Class</strong>
          <small>Dance academy</small>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavigation">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="student.html">Student</a>
          <a class="nav-link active" href="students.html" aria-current="page">All students</a>
          <a class="nav-link" href="pricing.html">Pricing</a>
          <a class="nav-link" href="enrollment.html">Enrollment</a>
          <a class="btn btn-warning fw-bold ms-lg-2" href="login.html">
            <i class="bi bi-person-badge"></i>
            School portal
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="students-page">
    <section class="students-hero">
      <div>
        <p class="eyebrow">MongoDB student roster</p>
        <h1>All students</h1>
        <p id="studentsSummary">Loading the active student roster from the backend.</p>
        <div class="student-uri">
          <i class="bi bi-link-45deg"></i>
          <span id="studentsUri">/api/students-showcase</span>
        </div>
      </div>
      <button class="btn btn-warning btn-lg fw-bold student-export-btn" id="exportStudentsPdf" type="button" disabled>
        <i class="bi bi-file-earmark-pdf"></i>
        Export all students PDF
      </button>
    </section>

    <section class="alc-section">
      <div class="students-toolbar">
        <div>
          <p class="eyebrow">Roster</p>
          <h2 id="studentsTitle">Student list</h2>
        </div>
        <span class="student-status" id="studentsCount">Connecting</span>
      </div>
      <div class="students-grid" id="studentsGrid" aria-live="polite"></div>
      <p class="notice" id="studentsMessage"></p>
    </section>
  </main>

  <footer class="alc-footer">
    <span>American Latin Class</span>
    <a href="student.html">Single student view</a>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="js/students-showcase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

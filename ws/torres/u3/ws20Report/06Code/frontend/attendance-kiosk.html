<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Kiosk | American Latin Class</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg alc-navbar sticky-top">
    <div class="container-fluid px-lg-5">
      <a class="navbar-brand alc-brand" href="index.html" aria-label="American Latin Class">
        <span class="alc-brand-mark">ALC</span>
        <span>
          <strong>American Latin Class</strong>
          <small>Dance academy</small>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavigation">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="pricing.html">Pricing</a>
          <a class="nav-link" href="enrollment.html">Enrollment</a>
          <a class="btn btn-warning fw-bold ms-lg-2" href="login.html">
            <i class="bi bi-person-badge"></i>
            School portal
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="page-shell">
    <section class="page-hero compact-hero">
      <div>
        <p class="eyebrow">Attendance</p>
        <h1>Attendance Kiosk</h1>
        <p>Mark attendance for today&rsquo;s class using the student&rsquo;s email.</p>
      </div>
    </section>

    <section class="alc-section pt-4">
      <form class="form-stack" id="kioskForm" autocomplete="off">
        <label>
          <span>Student email</span>
          <input id="kioskEmail" class="form-control form-control-lg" type="email" placeholder="student@americanlatinclass.com" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>
          <span>Class</span>
          <select id="kioskClass" class="form-select form-select-lg" required>
            <option value="">-- Select a class --</option>
          </select>
        </label>
        <button class="btn btn-warning btn-lg fw-bold" type="submit">
          <i class="bi bi-check-lg"></i>
          Mark present
        </button>
        <p class="notice" id="kioskMessage" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="alc-footer">
    <span>American Latin Class</span>
    <a href="login.html">School portal</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app-config.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/formatters.js"></script>
  <script src="js/session.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/branch-store.js"></script>
  <script src="js/public-pages.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | American Latin Class</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <div class="sidebar-header">
        <div class="session-avatar">
          <img id="sessionAvatarImage" src="" alt="">
          <span id="sessionAvatarInitials">AL</span>
        </div>
        <div>
          <strong id="sessionHeaderName">Signed in</strong>
          <small id="sessionHeaderRole">School portal</small>
        </div>
      </div>
      <nav class="module-nav" id="moduleNav"></nav>
      <div class="sidebar-footer">
        <button class="sidebar-control" id="homeButton" aria-label="Home">
          <i class="bi bi-house-door"></i> Home
        </button>
        <button class="sidebar-control" id="logoutButton" aria-label="Sign out">
          <i class="bi bi-box-arrow-right"></i> Sign out
        </button>
      </div>
    </aside>
    <main class="dashboard-main">
      <div class="dashboard-topline">
        <div>
          <p class="eyebrow" id="sessionRole">Loading...</p>
          <h1 id="dashboardTitle">Dashboard</h1>
        </div>
        <div class="month-control">
          <label class="month-picker">
            <i class="bi bi-calendar-month"></i>
            <input id="dashboardMonth" class="form-control form-control-sm" type="month">
          </label>
        </div>
      </div>
      <section class="dashboard-content">
        <h2 id="moduleTitle">Overview</h2>
        <div id="moduleHost"></div>
      </section>
    </main>
  </div>

  <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content alc-modal-content">
        <div class="modal-body text-center py-4">
          <i class="bi bi-box-arrow-right fs-1 text-warning mb-2 d-block"></i>
          <h5 class="fw-bold mb-1" id="logoutModalLabel">Sign out</h5>
          <p class="text-secondary mb-3">Are you sure you want to sign out?</p>
          <div class="d-flex gap-2 justify-content-center">
            <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger fw-bold px-4" id="logoutConfirm">
              <i class="bi bi-box-arrow-right"></i>
              Sign out
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app-config.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/formatters.js"></script>
  <script src="js/session.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/branch-store.js"></script>
  <script src="js/public-pages.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
